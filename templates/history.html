<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Query History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>⌬</span>
        AI SQL Assistant
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/schema">Schema</a>
        <a href="/history">History</a>
    </nav>

</header>


<main class="page">

    <div class="badge">
        QUERY HISTORY
    </div>

    <h1>Previous Queries</h1>

    <div id="historyContainer">
        Loading...
    </div>

</main>


<script>

async function loadHistory() {

    const response =
        await fetch("/api/history");

    const data =
        await response.json();

    const container =
        document.getElementById("historyContainer");

    container.innerHTML = "";

    if (!data.history.length) {

        container.innerHTML =
            "<p class='empty'>No query history yet.</p>";

        return;
    }

    data.history.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "history-card";

        card.innerHTML = `

            <div class="history-top">

                <strong>
                    ${item.question}
                </strong>

                <span>
                    ${item.timestamp}
                </span>

            </div>

            <pre>${item.sql}</pre>

        `;

        container.appendChild(card);

    });

}

loadHistory();

</script>

</body>
</html>
